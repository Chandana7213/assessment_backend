name: Deploy Backend to EC2

on:
  push:
    branches:
      - development

actions:
  deploy-to-ec2:
    identifier: aws/codebuild-run-command@v1
    inputs:
      instance-ids: ["i-054dc3049ddee2393"]
      commands:
        - cd /home/ec2-user
        - rm -rf assessment_backend
        - git clone https://chandana.dasari:${{secrets.AZURE_PAT}}@dev.azure.com/cloudorch/CloudOrchestrator/_git/assessment_backend
        - cd assessment_backend
        - git checkout development
        - pip3 install -r requirements.txt
        - nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &

